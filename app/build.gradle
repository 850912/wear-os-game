plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
}

android {
    def releaseKeystore = System.getenv('WBG_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('WBG_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('WBG_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('WBG_KEY_PASSWORD')
    def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        releaseUpload {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    namespace 'com.example.wearboardgames'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.example.wearboardgames'
        minSdk 30
        targetSdk 35
        versionCode 24
        versionName '8.1.1'
        resourceConfigurations += ['zh', 'en']
    }

    buildFeatures {
        compose true
        buildConfig false
        resValues false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // CI/local sideload builds fall back to the debug key. For store publishing,
            // provide WBG_KEYSTORE_PATH / WBG_KEYSTORE_PASSWORD / WBG_KEY_ALIAS / WBG_KEY_PASSWORD.
            signingConfig hasReleaseSigning ? signingConfigs.releaseUpload : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

baselineProfile {
    // CI generates a fresh profile explicitly on a Wear OS emulator before assembling Release.
    // Keeping this false avoids requiring an emulator for ordinary local assembleRelease calls.
    automaticGenerationDuringBuild false
    saveInSrc true
}

// Keep the complete Wear Compose family on the AGP 8.6.1 / compileSdk 35 compatible line.
// A transitive dependency can otherwise upgrade these modules to 1.7.x, whose AAR metadata
// requires compileSdk 37 and Android Gradle Plugin 9.1+.
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.wear.compose:compose-material3:1.6.2'
        force 'androidx.wear.compose:compose-foundation:1.6.2'
        force 'androidx.wear.compose:compose-material-core:1.6.2'
    }
}

dependencies {
    implementation 'com.github.bhlangonijr:chesslib:1.3.4'
    baselineProfile project(':baselineprofile')
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.wear.compose:compose-material3:1.6.2"
    implementation "androidx.wear.compose:compose-foundation:1.6.2"
    implementation "androidx.wear.compose:compose-material-core:1.6.2"
    implementation "androidx.wear:wear-remote-interactions:1.2.0"
}

name: Build Wear OS APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Test, lint and build APKs
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify optimized Release size
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES / 1048576 }")
          echo "### Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: **${MIB} MiB** (${BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- R8 minification: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource shrinking: enabled" >> "$GITHUB_STEP_SUMMARY"
          test "$BYTES" -le 2097152 || { echo "Release APK exceeds the 2 MiB budget"; exit 1; }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-os-game-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-os-game-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/configuration.txt
